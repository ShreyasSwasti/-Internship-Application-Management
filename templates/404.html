<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff3e6;
            font-family: Arial, sans-serif;
        }

        .error-card {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 70px;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            background: #e67e22;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background: #d35400;
        }
    </style>
</head>

<body>

    <div class="error-card">
        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            The page you are looking for does not exist.
        </p>

        <a href="{{ url_for('auth.login') }}" class="btn">
            Back to Login
        </a>
    </div>

</body>
</html>
