<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HR Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff3e6;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: #f28c28;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout-btn {
            background: white;
            color: #f28c28;
            padding: 9px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .dashboard {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .welcome-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .welcome-card h1 {
            margin-top: 0;
        }

        .info-box {
            background: #fff8f2;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Internship Application System</h2>

        <a href="{{ url_for('auth.logout') }}" class="logout-btn">
            Logout
        </a>
    </div>

    <div class="dashboard">

        <div class="welcome-card">

            <h1>Welcome, {{ name }}!</h1>

            <p>You have successfully logged in as an HR Manager.</p>

            <div class="info-box">
                <strong>Name:</strong> {{ name }}
            </div>

            <div class="info-box">
                <strong>Email:</strong> {{ email }}
            </div>

            <div class="info-box">
                <strong>Role:</strong> HR Manager
            </div>

        </div>

    </div>

</body>
</html>
